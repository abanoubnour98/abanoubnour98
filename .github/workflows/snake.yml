name: Generate GitHub contribution snake

on:
  # Generate a fresh contribution animation every day.
  schedule:
    - cron: "0 0 * * *"

  # Allow a manual run from the Actions tab.
  workflow_dispatch:

  # Also regenerate after changes to the default branch.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: abanoubnour98
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
